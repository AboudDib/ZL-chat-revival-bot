# render.yaml
# Render.com deployment configuration for ReviveBot
# Deployed as a Web Service — free tier requires an HTTP port + self-ping
# (see bot.js) to avoid the 15-minute idle spin-down.

services:
  - type: web
    name: discord-revival-bot
    runtime: node
    plan: free          # Upgrade to starter ($7/mo) for persistent disk
    buildCommand: npm install && node scripts/registerCommands.js
    startCommand: node bot.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false      # Set manually in Render dashboard (secret)
      - key: DISCORD_CLIENT_ID
        sync: false      # Set manually in Render dashboard
      - key: DISCORD_GUILD_ID
        sync: false      # Optional — set for instant guild-only command registration
      - key: GEMINI_API_KEY
        sync: false      # Set manually in Render dashboard — primary AI provider
      - key: GROQ_API_KEY
        sync: false      # Set manually in Render dashboard (optional fallback)
    disk:
      name: revival-data
      mountPath: /data
      sizeGB: 1          # Required for SQLite persistence across deploys
